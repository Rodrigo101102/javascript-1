<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora en JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .calculadora {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        #pantalla {
            width: 100%;
            height: 50px;
            font-size: 1.5em;
            text-align: right;
            margin-bottom: 10px;
        }
        .botones button {
            width: 60px;
            height: 60px;
            font-size: 1.2em;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <input type="text" id="pantalla" disabled>
        <div class="botones">
            <button onclick="agregarValor('7')">7</button>
            <button onclick="agregarValor('8')">8</button>
            <button onclick="agregarValor('9')">9</button>
            <button onclick="agregarValor('/')">/</button>
            <br>
            <button onclick="agregarValor('4')">4</button>
            <button onclick="agregarValor('5')">5</button>
            <button onclick="agregarValor('6')">6</button>
            <button onclick="agregarValor('*')">*</button>
            <br>
            <button onclick="agregarValor('1')">1</button>
            <button onclick="agregarValor('2')">2</button>
            <button onclick="agregarValor('3')">3</button>
            <button onclick="agregarValor('-')">-</button>
            <br>
            <button onclick="agregarValor('0')">0</button>
            <button onclick="agregarValor('.')">.</button>
            <button onclick="calcular()">=</button>
            <button onclick="agregarValor('+')">+</button>
            <br>
            <button onclick="limpiarPantalla()" style="width: 100%; background: red; color: white;">C</button>
        </div>
    </div>

    <script>
        function agregarValor(valor) {
            document.getElementById('pantalla').value += valor;
        }
        function calcular() {
            try {
                document.getElementById('pantalla').value = eval(document.getElementById('pantalla').value);
            } catch (error) {
                alert('Expresión inválida');
            }
        }
        function limpiarPantalla() {
            document.getElementById('pantalla').value = '';
        }
    </script>
</body>
</html>
